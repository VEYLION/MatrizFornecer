<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matriz | Fornecedor Digital</title>
  <meta name="description" content="Encontre contas e produtos digitais de Free Fire, Blox Fruits, Valorant, Steam e Gift Cards." />
  <link rel="icon" type="image/png" href="images/logo.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .glow-cyan {
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
    }
    .glow-cyan-sm {
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
    }
    .glow-text {
      text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-gray-950 text-slate-100 overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Dados centralizados das categorias e links oficiais do Telegram
    const categoriesData = [
      {
        id: "freefire",
        name: "Free Fire",
        description: "Contas e produtos de Free Fire com os melhores recursos do jogo.",
        image: "images/freefire.jpg",
        telegram: "http://t.me/MatrizFF_bot",
        buttonText: "Ver Free Fire",
        badge: "Populares"
      },
      {
        id: "bloxfruits",
        name: "Blox Fruits",
        description: "Contas e produtos de Blox Fruits prontos para você dominar os mares.",
        image: "images/bloxfruits.jpg",
        telegram: "http://t.me/MatrizBlox_bot",
        buttonText: "Ver Blox Fruits",
        badge: "Em alta"
      },
      {
        id: "valorant",
        name: "Valorant",
        description: "Contas e produtos de Valorant com os mais variados itens e skins.",
        image: "images/valorant.jpg",
        telegram: "http://t.me/MatrizValorant_bot",
        buttonText: "Ver Valorant",
        badge: "Gamer"
      },
      {
        id: "steam",
        name: "Steam",
        description: "Contas e produtos de Steam para expandir sua biblioteca de jogos.",
        image: "images/steam.jpg",
        telegram: "http://t.me/MatrizSteam_bot",
        buttonText: "Ver Steam",
        badge: "Catálogo"
      },
      {
        id: "giftcards",
        name: "Gift Cards",
        description: "Gift Cards e produtos digitais para as principais plataformas.",
        image: "images/Giftcard.jpg",
        telegram: "http://t.me/MatrizGiftcards_bot",
        buttonText: "Ver Gift Cards",
        badge: "Digital"
      }
    ];

    // Ícone SVG auxiliar do Telegram
    const TelegramIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.07-.75 4.19-1.82 6.98-3.02 8.38-3.6 3.99-1.66 4.82-1.95 5.36-1.96.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.21-.03.38z"/>
      </svg>
    );

    // Componente NAVBAR
    function Navbar() {
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 30);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navLinks = [
        { name: "Início", href: "#inicio" },
        { name: "Categorias", href: "#categorias" },
        { name: "Como Funciona", href: "#como-funciona" },
        { name: "Avaliações", href: "#avaliacoes" },
        { name: "Contato", href: "#contato" },
      ];

      return (
        <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${
          scrolled ? 'bg-gray-950/90 backdrop-blur-md border-b border-cyan-500/20 py-3 shadow-lg shadow-cyan-950/20' : 'bg-transparent py-5'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            
            {/* LOGO MATRIZ */}
            <a href="#inicio" className="flex items-center space-x-3 group">
              <div className="relative w-10 h-10 rounded-lg overflow-hidden border border-cyan-500/40 p-0.5 group-hover:border-cyan-400 transition-colors">
                <img 
                  src="images/logo.png" 
                  alt="MATRIZ Logo" 
                  className="w-full h-full object-cover rounded-md"
                  onError={(e) => { e.target.src = 'https://via.placeholder.com/100?text=MATRIZ'; }}
                />
              </div>
              <div className="flex flex-col">
                <span className="font-orbitron text-xl font-bold tracking-wider text-white group-hover:text-cyan-400 transition-colors">
                  MATRIZ
                </span>
                <span className="text-[10px] tracking-widest text-cyan-400 font-medium uppercase -mt-1">
                  Fornecedor Digital
                </span>
              </div>
            </a>

            {/* LINKS DESKTOP */}
            <div className="hidden md:flex items-center space-x-8">
              {navLinks.map((link) => (
                <a
                  key={link.name}
                  href={link.href}
                  className="text-sm text-gray-300 hover:text-cyan-400 font-medium transition-colors duration-200 hover:glow-text"
                >
                  {link.name}
                </a>
              ))}
            </div>

            {/* BOTÃO TELEGRAM DESKTOP */}
            <div className="hidden md:block">
              <a
                href="http://t.me/MatrizFF_bot"
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center space-x-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-medium text-sm px-5 py-2.5 rounded-full transition-all duration-300 transform hover:-translate-y-0.5 glow-cyan-sm border border-cyan-400/30"
              >
                <TelegramIcon className="w-4 h-4" />
                <span>Telegram</span>
              </a>
            </div>

            {/* BOTÃO MOBILE (HAMBURGER) */}
            <div className="md:hidden">
              <button
                onClick={() => setIsMenuOpen(!isMenuOpen)}
                className="p-2 rounded-lg text-gray-300 hover:text-white hover:bg-gray-800/60 border border-gray-800 transition-colors"
                aria-label="Abrir Menu"
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {isMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                  )}
                </svg>
              </button>
            </div>
          </div>

          {/* MENU MOBILE EXPANDIDO */}
          {isMenuOpen && (
            <div className="md:hidden bg-gray-950/95 backdrop-blur-xl border-b border-cyan-500/20 px-4 pt-4 pb-6 space-y-3">
              {navLinks.map((link) => (
                <a
                  key={link.name}
                  href={link.href}
                  onClick={() => setIsMenuOpen(false)}
                  className="block px-3 py-2 text-base font-medium text-gray-200 hover:text-cyan-400 hover:bg-gray-900/60 rounded-md transition-colors"
                >
                  {link.name}
                </a>
              ))}
              <div className="pt-2">
                <a
                  href="http://t.me/MatrizFF_bot"
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={() => setIsMenuOpen(false)}
                  className="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-medium px-4 py-3 rounded-lg text-center"
                >
                  <TelegramIcon className="w-5 h-5" />
                  <span>Telegram</span>
                </a>
              </div>
            </div>
          )}
        </nav>
      );
    }

    // Componente HERO
    function Hero() {
      return (
        <section id="inicio" className="relative min-h-screen flex items-center justify-center pt-24 pb-16 overflow-hidden">
          {/* VÍDEO DE FUNDO DA HERO SECTION */}
          <div className="absolute inset-0 z-0">
            <video
              autoPlay
              muted
              loop
              playsInline
              className="w-full h-full object-cover opacity-35"
            >
              <source src="videos/hero.mp4" type="video/mp4" />
            </video>
            {/* Gradientes de contraste para leitura perfeita */}
            <div className="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/70 to-transparent"></div>
            <div className="absolute inset-0 bg-gradient-to-r from-gray-950/80 via-transparent to-gray-950/80"></div>
          </div>

          {/* Conteúdo Central da Hero */}
          <div className="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 text-center space-y-8">
            
            {/* Logo e Insígnia */}
            <div className="flex flex-col items-center justify-center space-y-4">
              <div className="relative group">
                <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl blur-lg opacity-75 group-hover:opacity-100 transition duration-500"></div>
                <div className="relative w-28 h-28 sm:w-36 sm:h-36 rounded-2xl bg-gray-900 border border-cyan-400/40 p-2 overflow-hidden shadow-2xl flex items-center justify-center">
                  <img 
                    src="images/logo.png" 
                    alt="MATRIZ Logo" 
                    className="w-full h-full object-cover rounded-xl"
                    onError={(e) => { e.target.src = 'https://via.placeholder.com/150?text=MATRIZ'; }}
                  />
                </div>
              </div>

              <div className="inline-flex items-center space-x-2 bg-cyan-950/80 border border-cyan-500/40 px-4 py-1.5 rounded-full text-xs sm:text-sm text-cyan-300 tracking-wider uppercase font-semibold">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>MATRIZ — FORNECEDOR DIGITAL</span>
              </div>
            </div>

            {/* Titulo & Headline */}
            <div className="space-y-4 max-w-3xl mx-auto">
              <h1 className="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight font-orbitron text-white leading-tight">
                Seus produtos digitais em <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-500 glow-text">um só lugar.</span>
              </h1>
              <p className="text-base sm:text-lg md:text-xl text-gray-300 font-normal leading-relaxed max-w-2xl mx-auto">
                Escolha sua categoria e continue seu atendimento diretamente pelo nosso bot no Telegram.
              </p>
            </div>

            {/* Botão de Ação Principal */}
            <div className="pt-4">
              <a
                href="#categorias"
                className="inline-flex items-center space-x-3 bg-gradient-to-r from-cyan-500 via-cyan-600 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-bold text-base sm:text-lg px-8 py-4 rounded-xl transition-all duration-300 transform hover:-translate-y-1 glow-cyan shadow-xl cursor-pointer"
              >
                <span>Ver produtos</span>
                <svg className="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
              </a>
            </div>

          </div>
        </section>
      );
    }

    // Componente CATEGORIAS (Cards)
    function CategoriesSection() {
      return (
        <section id="categorias" className="relative py-20 bg-gray-950/80">
          
          {/* Fundo sutil com partículas/glow */}
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-950/20 via-transparent to-transparent pointer-events-none"></div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            
            <div className="text-center max-w-3xl mx-auto mb-16 space-y-3">
              <h2 className="text-2xl sm:text-4xl font-extrabold font-orbitron text-white">
                Escolha sua <span className="text-cyan-400">categoria</span>
              </h2>
              <p className="text-gray-400 text-sm sm:text-base">
                Selecione o produto que você procura e continue diretamente pelo Telegram.
              </p>
            </div>

            {/* Grid dos Cards */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {categoriesData.map((category) => (
                <div
                  key={category.id}
                  className="group relative bg-gray-900/80 rounded-2xl overflow-hidden border border-gray-800 hover:border-cyan-500/60 transition-all duration-300 hover:-translate-y-2 flex flex-col justify-between hover:shadow-2xl hover:shadow-cyan-500/20"
                >
                  {/* Imagem do Card */}
                  <div className="relative h-52 w-full overflow-hidden bg-gray-950">
                    <img
                      src={category.image}
                      alt={category.name}
                      className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500 ease-out"
                      onError={(e) => { e.target.src = 'https://via.placeholder.com/400x250?text=' + category.name; }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                    <span className="absolute top-3 right-3 bg-gray-950/80 backdrop-blur-md border border-cyan-500/40 text-cyan-400 text-xs font-semibold px-3 py-1 rounded-full">
                      {category.badge}
                    </span>
                  </div>

                  {/* Detalhes do Produto */}
                  <div className="p-6 flex-1 flex flex-col justify-between space-y-4">
                    <div className="space-y-2">
                      <h3 className="text-xl font-bold font-orbitron text-white group-hover:text-cyan-300 transition-colors">
                        {category.name}
                      </h3>
                      <p className="text-gray-400 text-sm leading-relaxed">
                        {category.description}
                      </p>
                    </div>

                    {/* Botão direcionando para o Telegram correto */}
                    <div className="pt-2">
                      <a
                        href={category.telegram}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="w-full inline-flex items-center justify-center space-x-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold text-sm py-3 px-4 rounded-xl transition-all duration-300 shadow-md group-hover:glow-cyan-sm"
                      >
                        <TelegramIcon className="w-4 h-4" />
                        <span>{category.buttonText}</span>
                      </a>
                    </div>
                  </div>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }

    // Componente COMO FUNCIONA
    function HowItWorks() {
      const steps = [
        {
          number: "01",
          title: "Escolha sua categoria",
          description: "Navegue pela nossa vitrine digital e selecione o jogo ou produto de sua preferência."
        },
        {
          number: "02",
          title: "Entre no nosso bot",
          description: "Você será direcionado ao bot oficial da categoria no Telegram com total segurança."
        },
        {
          number: "03",
          title: "Finalize seu atendimento pelo Telegram",
          description: "Tire dúvidas e conclua seu pedido de forma automatizada e rápida com nossa equipe."
        }
      ];

      return (
        <section id="como-funciona" className="relative py-20 bg-gray-950 border-t border-gray-900">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="text-center max-w-3xl mx-auto mb-16 space-y-3">
              <h2 className="text-2xl sm:text-4xl font-extrabold font-orbitron text-white">
                Como <span className="text-cyan-400">funciona</span>
              </h2>
              <p className="text-gray-400 text-sm sm:text-base">
                Simplicidade e agilidade em apenas 3 passos claros.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {steps.map((step, index) => (
                <div 
                  key={index}
                  className="bg-gray-900/50 border border-gray-800/80 hover:border-cyan-500/40 p-8 rounded-2xl relative overflow-hidden transition-all duration-300 hover:-translate-y-1"
                >
                  <div className="text-5xl font-extrabold font-orbitron text-cyan-500/20 mb-4">
                    {step.number}
                  </div>
                  <h3 className="text-xl font-bold text-white mb-2">
                    {step.title}
                  </h3>
                  <p className="text-gray-400 text-sm leading-relaxed">
                    {step.description}
                  </p>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }

    // Componente SEÇÃO DE CONFIANÇA
    function TrustSection() {
      const highlights = [
        { title: "ATENDIMENTO RÁPIDO", icon: "⚡" },
        { title: "PRODUTOS DIGITAIS", icon: "💎" },
        { title: "COMPRA SIMPLES", icon: "🛡️" },
        { title: "ATENDIMENTO PELO TELEGRAM", icon: "✈️" },
      ];

      return (
        <section className="py-12 bg-gradient-to-r from-gray-950 via-cyan-950/20 to-gray-950 border-y border-cyan-500/20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
              {highlights.map((item, index) => (
                <div key={index} className="p-4 rounded-xl bg-gray-900/40 border border-gray-800/50">
                  <div className="text-2xl mb-2">{item.icon}</div>
                  <div className="font-orbitron font-bold text-xs sm:text-sm text-cyan-300 tracking-wider">
                    {item.title}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // Componente AVALIAÇÕES (Carousel/Demonstrativo)
    function Testimonials() {
      const testimonialsData = [
        {
          name: "Vitor",
          text: "Atendimento incrível e entrega super rápida pelo Telegram. Recomendadíssimo!",
          date: "Depoimento",
          initials: "CE"
        },
        {
          name: "Luiz",
          text: "O bot do Telegram responde na hora. Processo simples e direto sem enrolação.",
          date: "Depoimento",
          initials: "CX"
        },
        {
          name: "joão",
          text: "Excelente fornecedor de produtos digitais. Interface da loja facilitou bastante.",
          date: "Depoimento",
          initials: "CL"
        }
      ];

      const [currentIndex, setCurrentIndex] = useState(0);

      const nextSlide = () => {
        setCurrentIndex((prev) => (prev + 1) % testimonialsData.length);
      };

      const prevSlide = () => {
        setCurrentIndex((prev) => (prev - 1 + testimonialsData.length) % testimonialsData.length);
      };

      return (
        <section id="avaliacoes" className="py-20 bg-gray-950">
          <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="text-center mb-12 space-y-3">
              <h2 className="text-2xl sm:text-4xl font-extrabold font-orbitron text-white">
                O que nossos clientes <span className="text-cyan-400">dizem</span>
              </h2>
              <span className="inline-block bg-gray-900 border border-cyan-500/30 text-cyan-400 text-xs px-3 py-1 rounded-full">
                DEPOIMENTOS
              </span>
            </div>

            {/* Slider */}
            <div className="relative bg-gray-900/60 border border-gray-800 rounded-2xl p-8 md:p-12 text-center shadow-xl">
              <div className="flex justify-center text-yellow-400 space-x-1 mb-4">
                {[...Array(5)].map((_, i) => (
                  <span key={i} className="text-xl">★</span>
                ))}
              </div>

              <p className="text-lg sm:text-xl text-gray-200 italic mb-6">
                "{testimonialsData[currentIndex].text}"
              </p>

              <div className="flex items-center justify-center space-x-3">
                <div className="w-10 h-10 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-sm border border-cyan-400">
                  {testimonialsData[currentIndex].initials}
                </div>
                <div className="text-left">
                  <div className="font-bold text-white text-sm">
                    {testimonialsData[currentIndex].name}
                  </div>
                  <div className="text-xs text-gray-400">
                    {testimonialsData[currentIndex].date}
                  </div>
                </div>
              </div>

              {/* Controles do Slider */}
              <div className="flex items-center justify-between mt-8 pt-6 border-t border-gray-800/80">
                <button
                  onClick={prevSlide}
                  className="p-2 rounded-lg bg-gray-800 hover:bg-cyan-600 text-white transition-colors"
                >
                  ❮
                </button>
                <div className="flex space-x-2">
                  {testimonialsData.map((_, idx) => (
                    <button
                      key={idx}
                      onClick={() => setCurrentIndex(idx)}
                      className={`w-3 h-3 rounded-full transition-colors ${
                        idx === currentIndex ? 'bg-cyan-400' : 'bg-gray-700'
                      }`}
                    />
                  ))}
                </div>
                <button
                  onClick={nextSlide}
                  className="p-2 rounded-lg bg-gray-800 hover:bg-cyan-600 text-white transition-colors"
                >
                  ❯
                </button>
              </div>

            </div>

          </div>
        </section>
      );
    }
